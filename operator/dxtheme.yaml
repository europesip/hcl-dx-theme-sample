# The EUROPESIP sample theme in HCL DX with the HCL DX Script Application operator
# (https://github.com/europesip/hcl-dx-scriptapp-operator, 0.3.0 or later). The operator downloads the release
# archive of this repository, uploads the theme/ folder to the WebDAV store of DX and registers the theme.
apiVersion: dx.europesip.com/v1alpha1
kind: DXTheme
metadata:
  name: europesip
spec:
  connectionRef: { name: dx }                 # your DXConnection
  uniqueName: europesip.theme.sample          # pages refer to it (DXPage spec.theme)
  titles: { en: "EUROPESIP", es: "EUROPESIP" }
  description: EUROPESIP sample theme
  base: { copyFiles: false }                  # a complete theme of its own: nothing is copied from another theme
  source:
    url:
      url: https://github.com/europesip/hcl-dx-theme-sample/archive/refs/tags/v1.0.0.tar.gz
      path: hcl-dx-theme-sample-1.0.0/theme
  profile: profiles/profile_europesip.json
  layout: layout-templates/1Column
---
# A page that uses it
apiVersion: dx.europesip.com/v1alpha1
kind: DXPage
metadata:
  name: europesip-home
spec:
  connectionRef: { name: dx }
  friendlyName: europesip
  titles: { en: "EUROPESIP", es: "EUROPESIP" }
  theme: europesip.theme.sample
  layoutTemplate: dav:fs-type1/themes/europesip/layout-templates/1Column
  applications: [{ name: my-app }]            # a DXScriptApplication of yours
  dependsOn: [{ kind: DXTheme, name: europesip }]
