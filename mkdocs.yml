# TechDocs of the HCL DX theme sample: the docs/ folder, shown in the EUROPESIP Internal Developer Portal (Backstage)
# through the annotation backstage.io/techdocs-ref of catalog-info.yaml. Build locally (same as Backstage):
#   pip install mkdocs-techdocs-core==1.7.1 && mkdocs serve
site_name: HCL DX theme sample · EUROPESIP
site_description: Sample theme for HCL DX (DX Compose and DX 9.5) with the EUROPESIP colours and logo (not an HCL product)
repo_url: https://github.com/europesip/hcl-dx-theme-sample
edit_uri: edit/main/docs/
docs_dir: docs

plugins:
  - techdocs-core

nav:
  - Overview: index.md
  - Español:
      - Introducción: index.es.md

# Heading anchors as GitHub makes them (accents kept: #licencia, #qué-contiene), so the same links work on GitHub and here
markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
