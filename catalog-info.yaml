# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# catalog-info.yaml · Entry of this repository in the EUROPESIP developer portal (Backstage)
#
# What it is for
#   Backstage (https://backstage.k3s.europesip.com) is the internal developer portal (IDP) of EUROPESIP: a catalog of
#   every product, service and repository, with its owner, its links and how it relates to the rest. Backstage reads
#   the GitHub organization "europesip" through the read-only GitHub App "europesip-backstage" and creates a catalog
#   entry for every repository that has THIS file at its root. Without it, the repository does not appear on its own.
#
# What it is NOT
#   It is not part of the theme: it is not in the theme/ folder nor in the release archive, and DX never reads it.
#   Changing or deleting it only changes how the repository is shown in Backstage (picked up within about 30 minutes).
#
# Format: Backstage descriptor format, https://backstage.io/docs/features/software-catalog/descriptor-format
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Component                       # a piece of software that is built and published (here, a DX theme)
metadata:
  name: dx-theme-sample               # unique id in the catalog (lower case, no spaces); other entities point to it
  title: HCL DX theme sample · EUROPESIP     # name shown in Backstage
  description: >-
    Sample theme for HCL DX (DX Compose and DX 9.5) with the EUROPESIP colours and logo, written from scratch:
    templates, layouts, stylesheet and theme module. Published to DX with the DXTheme resource of the operator.
  tags: [hcl-dx, dx-compose, theme, webdav, sample]    # free labels, used by the catalog search and filters
  annotations:
    # GitHub repository of this component: Backstage uses it for the links and the GitHub cards of the entity page
    github.com/project-slug: europesip/hcl-dx-theme-sample
    # where the source lives (the "View source" button)
    backstage.io/source-location: url:https://github.com/europesip/hcl-dx-theme-sample/tree/main/
  links:                              # buttons in the "Links" card of the entity page
    - { url: 'https://github.com/europesip/hcl-dx-theme-sample#readme', title: README, icon: docs }
    - { url: 'https://github.com/europesip/hcl-dx-theme-sample/releases', title: Releases (theme archive) }
    - { url: 'https://github.com/europesip/hcl-dx-scriptapp-operator', title: Operator that publishes it (DXTheme) }
spec:
  type: dx-theme                      # kind of component: a theme of HCL DX (WebDAV)
  lifecycle: experimental             # it is a sample: experimental | production | deprecated
  owner: plataforma                   # team that answers for it (a Group of the catalog)
  system: productos-europesip         # the larger system it belongs to: EUROPESIP products published on GitHub
  dependsOn: [component:dxop]         # it is published to DX by the Script Application operator
